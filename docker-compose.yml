services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: verdict-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdict_dev}
      POSTGRES_DB: ${POSTGRES_DB:-verdict}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdict} -d ${POSTGRES_DB:-verdict}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

