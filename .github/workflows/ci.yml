name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: verdict
          POSTGRES_PASSWORD: verdict_dev
          POSTGRES_DB: verdict
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend

      - name: Type check with mypy
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Run pytest test suite
        env:
          DATABASE_URL: postgresql+psycopg://verdict:verdict_dev@localhost:5432/verdict
          JWT_SECRET: ci_secret_test_key_for_testing_only
        run: pytest -c backend/pyproject.toml backend/tests/ -v

  frontend:
    name: Frontend Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint --prefix frontend

      - name: Type check with tsc
        run: npx --prefix frontend tsc -b

      - name: Run unit tests with vitest
        run: npm run test --prefix frontend

      - name: Build production bundle
        run: npm run build --prefix frontend
